[package]
name = "nellie"
version = "0.5.3"
edition = "2021"
rust-version = "1.75"
authors = ["Sequel Data <dev@sequeldata.com>"]
description = "Production-grade semantic code memory system"
license = "MIT"
repository = "https://github.com/mmorris35/nellie"
keywords = ["semantic-search", "code-search", "mcp", "embeddings"]
categories = ["development-tools", "database"]

[dependencies]
# Async runtime
tokio = { version = "=1.50.0", features = ["full"] }

# Random
rand = "=0.8.5"

# Async utilities
futures = "=0.3.32"
tokio-stream = "=0.1.18"
async-stream = "=0.3.6"

# MCP Protocol
rmcp = { version = "=1.8.0", features = ["server", "transport-streamable-http-server"] }

# HTTP Server
axum = { version = "=0.8.8", features = ["macros"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.6.8", features = ["cors", "trace"] }

# Database
rusqlite = { version = "=0.32.1", features = ["bundled", "blob"] }
sqlite-vec = "=0.1.9"

# Embeddings (ONNX Runtime)
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
ndarray = "=0.16.1"
tokenizers = "=0.20.4"

# File watching
notify = { version = "=6.1.1", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "=0.4.1"
ignore = "=0.4.25"
walkdir = "=2.5.0"

# Serialization
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

# CLI
clap = { version = "=4.6.0", features = ["derive", "env"] }

# Error handling
thiserror = "=2.0.18"
anyhow = "=1.0.104"

# Logging & Metrics
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
prometheus = "=0.14.0"

# Utilities
uuid = { version = "=1.23.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.44", features = ["serde"] }
once_cell = "=1.21.4"
parking_lot = "=0.12.5"
crossbeam-channel = "=0.5.15"
blake3 = "=1.8.4"
tokio-util = "=0.7.18"
# Graph memory (Nellie-V)
petgraph = "=0.6.5"
strsim = "=0.11.1"
# Tree-sitter structural parsing
tree-sitter = "=0.25.10"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-go = "=0.25.0"
dirs = "=5.0.1"
reqwest = { version = "=0.12.28", features = ["json", "stream"] }
sha2 = "=0.10.9"
flate2 = "=1.1.9"
tar = "=0.4.45"
tempfile = "=3.27.0"
urlencoding = "=2.1.3"

[dev-dependencies]
tokio-test = "=0.4.5"
criterion = "=0.5.1"
insta = "=1.47.2"

[[bench]]
name = "search_benchmark"
harness = false

[[bench]]
name = "structural_bench"
harness = false

[[example]]
name = "soak"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
